<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご予約フォーム</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f5f5f5; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { font-size: 18px; margin-bottom: 20px; text-align: center; color: #06C755; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; background-color: #06C755; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    button:disabled { background-color: #ccc; }
    #status { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>整体Web予約</h2>
  <form id="bookingForm">
    <div class="form-group">
      <label>お名前（必須）</label>
      <input type="text" id="name" required placeholder="山田 太郎">
    </div>
    <div class="form-group">
      <label>お電話番号（必須）</label>
      <input type="tel" id="phone" required placeholder="09012345678">
    </div>
    <div class="form-group">
      <label>ご希望日（必須）</label>
      <input type="date" id="date" required>
    </div>
    <div class="form-group">
      <label>ご希望時間（30分枠）</label>
      <select id="time" required disabled>
        <option value="">日付を先に選択してください</option>
      </select>
    </div>
    <div class="form-group">
      <label>お悩み・気になる症状</label>
      <textarea id="symptom" rows="3" placeholder="肩こり、腰痛 など"></textarea>
    </div>
    <button type="submit" id="submitBtn">予約を確定する</button>
  </form>
  <div id="status"></div>
</div>

<script>
  // ==========================================
  // 【設定エリア】ご提示いただいたIDとURLを設定済み
  // ==========================================
  const LIFF_ID        = "2012311367-1GsUqpDC"; 
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbweg6ZXqC0CRZ-5XTGRE10JYt-jrXUBTGwl4nUbspfG_1uNdtNxPKJz-bFmlDjor4Ei/exec";
  
  let userLineId = "";

  // 1. LIFF初期化
  document.addEventListener("DOMContentLoaded", function() {
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            userLineId = profile.userId;
            if (profile.displayName) {
              document.getElementById("name").value = profile.displayName;
            }
          });
        }
      })
      .catch(err => console.error("LIFF Init Error:", err));
  });

  // 2. 日付選択時にGoogleカレンダーから空き枠を自動取得
  document.getElementById("date").addEventListener("change", function() {
    const selectedDate = this.value;
    const timeSelect = document.getElementById("time");
    const status = document.getElementById("status");

    if (!selectedDate) return;

    timeSelect.disabled = true;
    timeSelect.innerHTML = '<option value="">空き枠を確認中...</option>';
    status.innerText = "";

    fetch(`${GAS_WEBAPP_URL}?date=${selectedDate}`)
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          timeSelect.innerHTML = "";
          if (!data.slots || data.slots.length === 0) {
            timeSelect.innerHTML = '<option value="">満席です（他の日付をお選びください）</option>';
          } else {
            timeSelect.innerHTML = '<option value="">希望時間を選択してください</option>';
            data.slots.forEach(slot => {
              const opt = document.createElement("option");
              opt.value = slot;
              opt.textContent = slot;
              timeSelect.appendChild(opt);
            });
            timeSelect.disabled = false;
          }
        } else {
          timeSelect.innerHTML = '<option value="">空き枠の取得に失敗しました</option>';
        }
      })
      .catch(err => {
        console.error(err);
        timeSelect.innerHTML = '<option value="">通信エラーが発生しました</option>';
      });
  });

  // 3. 予約確定時のデータ送信処理
  document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    btn.disabled = true;
    status.style.color = "#333";
    status.innerText = "予約処理中...";

    const payload = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      date: document.getElementById("date").value,
      time: document.getElementById("time").value,
      symptom: document.getElementById("symptom").value,
      userId: userLineId
    };

    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        status.style.color = "#06C755";
        status.innerText = "予約が完了しました！LINE画面に戻ります。";
        setTimeout(() => {
          liff.closeWindow();
        }, 2000);
      } else {
        status.style.color = "red";
        status.innerText = data.message || "予約に失敗しました。";
        btn.disabled = false;
      }
    })
    .catch(err => {
      status.style.color = "red";
      status.innerText = "通信エラーが発生しました。";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
